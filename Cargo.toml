[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/llm",
    "crates/acquire",
    "crates/normalize",
    "crates/extract",
    "crates/store",
    "crates/matching",
    "crates/resume",
    "crates/pipeline",
    "crates/api",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/mbrengineer/jobseeker"
authors = ["jobseeker contributors"]

[workspace.dependencies]
# internal
jobseeker-core = { path = "crates/core" }
jobseeker-db = { path = "crates/db" }
jobseeker-llm = { path = "crates/llm" }
jobseeker-acquire = { path = "crates/acquire" }
jobseeker-normalize = { path = "crates/normalize" }
jobseeker-extract = { path = "crates/extract" }
jobseeker-store = { path = "crates/store" }
jobseeker-matching = { path = "crates/matching" }
jobseeker-resume = { path = "crates/resume" }
jobseeker-pipeline = { path = "crates/pipeline" }
jobseeker-api = { path = "crates/api" }

# async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time"] }
tokio-util = "0.7"
futures = "0.3"

# http server
axum = { version = "0.8", features = ["macros", "json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "compression-br", "compression-gzip", "cors", "limit", "set-header", "timeout"] }
http = "1"

# http client
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "webpki-roots", "http2", "charset", "gzip", "brotli"] }

# data
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"

# openapi
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.2"

# util
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
blake3 = "1"
url = "2"
regex = "1"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
deunicode = "1"
zstd = "0.14"
argon2 = "0.5"
rand = "0.9"
scraper = "0.27"
rust-embed = "8"
mime_guess = "2"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

# Faster incremental dev builds: dependencies optimized, our code not.
[profile.dev.package."*"]
opt-level = 2
