<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; width: 300px; margin: 12px; }
      label { display: block; margin: 8px 0 4px; color: #444; }
      input { width: 100%; box-sizing: border-box; padding: 6px; }
      button { margin-top: 8px; width: 100%; padding: 8px; font-weight: 650; }
      button.secondary { background: #eee; font-weight: 500; }
      .muted { color: #666; font-size: 12px; }
      #status { margin-top: 8px; }
    </style>
  </head>
  <body>
    <strong>jobseeker</strong>
    <label>Server
      <input id="server" placeholder="http://127.0.0.1:8787" />
    </label>
    <label>Pairing code
      <input id="code" placeholder="7K2M-9QWX from jobseeker pair" autocomplete="off" />
    </label>
    <button id="pair" class="secondary" type="button">Pair this browser</button>
    <label>Device token
      <input id="token" placeholder="jst_… or pair above" />
    </label>
    <button id="capture">Capture this page</button>
    <p id="status" class="muted">Captures the rendered DOM of the tab you are looking at. The server never logs in.</p>
    <script src="popup.js"></script>
  </body>
</html>
